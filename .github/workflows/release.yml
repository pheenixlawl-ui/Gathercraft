# Builds the addon ZIP and uploads it to CurseForge, Wago and GitHub
# whenever a version tag like v0.1.0 is pushed.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CF_API_KEY      - CurseForge API token
#   WAGO_API_TOKEN  - Wago Addons API token
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
